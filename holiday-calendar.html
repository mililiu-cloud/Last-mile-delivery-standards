<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-2027年 全球尾程停摆假期日历</title>
<style>
  :root {
    --navy: #10233F;
    --navy-dark: #0A1830;
    --ink: #1B2432;
    --slate: #5B6472;
    --line: #E4E1D8;
    --paper: #FAF8F3;
    --card: #FFFFFF;
    --brass: #A88B4A;
    --brass-soft: #D8C79A;
    --severe: #7A2331; --severe-bg: #F7EBE9; --severe-line: #E3C6C3;
    --medium: #8A6A26; --medium-bg: #F6EFDE; --medium-line: #E4D3A6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #EEEAE1;
    font-family: "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
  }
  .shell { padding: 26px 20px 30px; }
  .page {
    max-width: 1240px; margin: 0 auto; background: var(--paper);
    border: 1px solid var(--line); border-radius: 2px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,20,10,0.04), 0 12px 32px rgba(20,20,10,0.08);
  }

  .header {
    background: var(--navy-dark);
    background-image: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 62%, #142a4e 100%);
    color: #fff; padding: 22px 34px 18px; position: relative;
    border-bottom: 2px solid var(--brass);
  }
  .kicker {
    display: block; color: var(--brass-soft); font-size: 10.5px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px;
  }
  .header h1 {
    margin: 0 0 4px; font-size: 25px; font-weight: 500; letter-spacing: 0.3px;
    font-family: "Noto Serif CJK SC", Georgia, serif;
  }
  .header .sub { display: none; }
  .header .coverage { color: #B9C4D9; font-size: 11.5px; line-height: 1.6; margin: 6px 0 0; max-width: 880px; letter-spacing: 0.1px; }
  .header .note { display: none; }
  .lang-toggle {
    position: absolute; top: 22px; right: 34px;
    background: transparent; border: 1px solid rgba(216,199,154,0.55);
    color: var(--brass-soft); border-radius: 2px; padding: 6px 16px; font-size: 11.5px; font-weight: 600;
    cursor: pointer; letter-spacing: 1px; transition: all 0.15s ease;
  }
  .lang-toggle:hover { background: rgba(216,199,154,0.12); border-color: var(--brass-soft); }

  .region-bar {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    background: #F2EEE3; padding: 10px 34px; border-bottom: 1px solid var(--line);
  }
  .region-bar .rlabel { font-size: 11.5px; color: var(--slate); font-weight: 600; letter-spacing: 0.3px; margin-right: 2px; }
  .region-select-wrap { position: relative; display: inline-block; }
  .region-select-wrap::after {
    content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--navy); font-size: 10px; pointer-events: none;
  }
  .region-select {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    border: 1px solid #CBC5B4; background: #fff; color: var(--ink);
    border-radius: 2px; padding: 6px 28px 6px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; min-width: 160px; font-family: inherit;
    transition: border-color 0.15s ease;
  }
  .region-select:hover { border-color: var(--brass); }
  .region-select:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 2px rgba(168,139,74,0.18); }
  .region-badge-hint { font-size: 11px; color: var(--slate); }
  .bar-divider { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }

  .month-nav { display: flex; align-items: center; gap: 10px; position: relative; }
  .month-nav-btn {
    width: 26px; height: 26px; border: 1px solid #CBC5B4; background: #fff;
    color: var(--navy); border-radius: 2px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
    font-family: inherit; padding: 0; line-height: 1;
  }
  .month-nav-btn:hover:not(:disabled) { background: var(--navy); color: #fff; border-color: var(--navy); }
  .month-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .month-picker { position: relative; display: inline-block; }
  .month-nav-label {
    font-size: 14px; font-weight: 600; color: var(--navy-dark); letter-spacing: 0.3px;
    font-family: "Noto Serif CJK SC", Georgia, serif; min-width: 108px; text-align: center;
    background: none; border: 1px solid transparent; border-radius: 2px; cursor: pointer;
    padding: 4px 8px; display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: all 0.15s ease;
  }
  .month-nav-label:hover { background: #F2EEE3; border-color: #E4E1D8; }
  .month-nav-label .caret { font-size: 9px; color: var(--brass); transition: transform 0.15s ease; }
  .month-nav-label.open .caret { transform: rotate(180deg); }
  .month-picker-panel {
    position: absolute; top: calc(100% + 6px); left: 0;
    background: #fff; border: 1px solid #CBC5B4; border-radius: 2px; box-shadow: 0 6px 20px rgba(20,20,10,0.14);
    padding: 10px; z-index: 20; width: 280px;
  }
  .month-picker-year { font-size: 10px; font-weight: 700; color: var(--slate); letter-spacing: 1px; margin: 6px 2px 4px; }
  .month-picker-year:first-child { margin-top: 0; }
  .month-picker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .month-picker-item {
    font-size: 11.5px; text-align: center; padding: 6px 2px; border: 1px solid #E4E1D8; border-radius: 2px;
    background: #FAF8F3; color: var(--ink); cursor: pointer; font-family: inherit; transition: all 0.15s ease;
  }
  .month-picker-item:hover { border-color: var(--brass); background: #FBF6EA; }
  .month-picker-item.active { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 600; }
  .month-picker-item.is-today:not(.active) { border-color: var(--brass); color: var(--brass); font-weight: 600; }
  .month-nav-today {
    font-size: 10.5px; color: var(--brass); font-weight: 600; border: 1px solid var(--brass-soft);
    border-radius: 2px; padding: 4px 9px; cursor: pointer; background: #fff; letter-spacing: 0.3px;
    transition: all 0.15s ease; font-family: inherit;
  }
  .month-nav-today:hover { background: #FBF6EA; }

  .empty-banner {
    margin: 12px 34px 0; padding: 9px 16px; background: var(--medium-bg); border: 1px solid var(--medium-line);
    border-left: 2px solid var(--medium); font-size: 12.5px; color: var(--medium);
  }

  .main-row { display: flex; gap: 22px; align-items: flex-start; padding: 18px 34px 6px; }
  .main-left { flex: 1 1 auto; min-width: 0; }
  .main-right { flex: 0 0 296px; }

  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; border: 1px solid var(--navy); border-bottom: none; }
  .weekday-row div {
    background: var(--navy); color: var(--brass-soft); text-align: center;
    font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    padding: 7px 0; border-right: 1px solid rgba(255,255,255,0.10);
  }
  .weekday-row div:last-child { border-right: none; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--line); }
  .cell {
    min-height: 68px; background: var(--card); border: 1px solid var(--line);
    margin: -1px 0 0 -1px; padding: 6px 7px; position: relative;
  }
  .cell.blank { background: #F4F1E9; }
  .cell.severe { background: var(--severe-bg); }
  .cell.medium { background: var(--medium-bg); }
  .cell.severe::before, .cell.medium::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  }
  .cell.severe::before { background: var(--severe); }
  .cell.medium::before { background: var(--medium); }
  .cell .num {
    font-size: 12.5px; font-weight: 500; color: var(--ink); line-height: 1;
    font-family: "Noto Serif CJK SC", Georgia, serif;
  }
  .cell.weekend .num { color: var(--severe); }
  .badge {
    display: inline-block; color: #fff; font-size: 8px; font-weight: 600;
    letter-spacing: 0.2px; padding: 1px 5px; border-radius: 1px; margin: 4px 0 1px;
  }
  .badge.severe { background: var(--severe); }
  .badge.medium { background: var(--medium); }
  .cell .label { font-size: 8.5px; color: #545B67; line-height: 1.25; margin: 1px 0 0; }

  .legend-card {
    background: var(--card); border: 1px solid var(--line);
  }
  .legend-title {
    color: var(--navy-dark); font-weight: 600; font-size: 11px; letter-spacing: 0.3px;
    padding: 8px 12px; border-bottom: 1px solid var(--line); background: #F2EEE3;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 10.5px; color: #3B4250; line-height: 1.4; }
  .legend-row:not(:last-child) { border-bottom: 1px solid #EFEBE0; }
  .swatch { width: 11px; height: 11px; flex-shrink: 0; margin-top: 1px; }
  .swatch.severe { background: var(--severe); }
  .swatch.medium { background: var(--medium); }

  .callout {
    background: var(--card); border: 1px solid var(--line); border-top: 2px solid var(--navy);
    margin: 10px 0 0; padding: 9px 12px;
  }
  .callout.sev-severe { border-top-color: var(--severe); }
  .callout.sev-medium { border-top-color: var(--medium); }
  .callout .top { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; flex-wrap: wrap; }
  .callout .code {
    background: var(--navy); color: var(--brass-soft); font-size: 8.5px; font-weight: 600;
    letter-spacing: 0.4px; padding: 1px 6px;
  }
  .callout .title { font-size: 11px; font-weight: 600; color: var(--navy-dark); }
  .callout .dates { color: var(--severe); font-size: 9.5px; font-weight: 600; margin: 2px 0 3px 0; }
  .callout .note { font-size: 10px; color: #4A5164; line-height: 1.42; }
  .no-callout {
    margin: 10px 0 0; padding: 12px; color: #8A8370; font-size: 11.5px;
    background: #F4F1E9; border: 1px dashed #D8D2C0; text-align: center;
  }
  .footer {
    padding: 10px 34px 16px; font-size: 10.5px; color: var(--slate);
    border-top: 1px solid var(--line);
  }
</style>
</head>

<div class="page">

    <div class="note" id="note"></div>

  <div id="emptyBanner"></div>
  <div class="main-row">
    <div class="main-left">

function findTodayMonthIdx() {
  const now = new Date();
  const id = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  let idx = MONTHS.findIndex(m => m.id === id);
  if (idx === -1) {
    idx = (id < MONTHS[0].id) ? 0 : MONTHS.length - 1;
  }
  return idx;
}

let lang = "zh";
let regionId = "all";
let monthIdx = 0; // index into MONTHS, default to first month (September)
let monthPickerOpen = false;

function currentRegion() { return REGIONS.find(r => r.id === regionId); }
function currentMonth() { return MONTHS[monthIdx]; }

function filteredItems(day) {
  const items = currentMonth().holidays[day] || [];
  if (regionId === "all") return items;
  return items.filter(h => h.region === regionId);
}

function render() {
  const region = currentRegion();
  const month = currentMonth();

  document.getElementById("kicker").textContent = T.kicker[lang];
  document.getElementById("title").textContent = month.title[lang];
  document.getElementById("subtitle").textContent = T.subtitle[lang];
  document.getElementById("note").textContent = T.note[lang];
  document.getElementById("legendTitle").textContent = T.legendTitle[lang];
  document.getElementById("legendSevere").textContent = T.legendSevere[lang];
  document.getElementById("legendMedium").textContent = T.legendMedium[lang];
  document.getElementById("langBtn").textContent = lang === "zh" ? "EN" : "中文";

  // coverage line: full list on "all", region-specific list otherwise
  let coverageText;
  if (regionId === "all") {
    const names = region.codes.map(c => COUNTRY[c][lang]).join(lang === "zh" ? " " : ", ");
    coverageText = (lang === "zh" ? "覆盖仓库/发货国家: " : "Coverage (current warehouse / fulfillment countries): ") + names;
  } else {
    const names = region.codes.map(c => COUNTRY[c][lang]).join(lang === "zh" ? " " : ", ");
    const extra = lang === "zh" ? region.noteZh : region.noteEn;
    coverageText = (region.codes.length ? names + " — " : "") + extra;
  }
  document.getElementById("coverage").textContent = coverageText;

  // filter bar: month select + region select
  const bar = document.getElementById("regionBar");
  bar.innerHTML = "";

  const mnav = document.createElement("div");
  mnav.className = "month-nav";

  const prevBtn = document.createElement("button");
  prevBtn.className = "month-nav-btn";
  prevBtn.textContent = "‹";
  prevBtn.setAttribute("aria-label", T.prevMonth[lang]);
  prevBtn.title = T.prevMonth[lang];
  prevBtn.disabled = monthIdx <= 0;
  prevBtn.onclick = () => { if (monthIdx > 0) { monthIdx -= 1; render(); } };
  mnav.appendChild(prevBtn);

  const todayIdxForPicker = findTodayMonthIdx();

  const mPicker = document.createElement("div");
  mPicker.className = "month-picker";

  const mLabel = document.createElement("button");
  mLabel.className = "month-nav-label" + (monthPickerOpen ? " open" : "");
  mLabel.innerHTML = `<span>${month.short[lang]}</span><span class="caret">▾</span>`;
  mLabel.onclick = (e) => { e.stopPropagation(); monthPickerOpen = !monthPickerOpen; render(); };
  mPicker.appendChild(mLabel);

  mnav.appendChild(mPicker);

  if (monthPickerOpen) {
    const panel = document.createElement("div");
    panel.className = "month-picker-panel";
    panel.onclick = (e) => e.stopPropagation();

    let lastYear = null;
    let yearGrid = null;
    MONTHS.forEach((m, i) => {
      const y = m.id.slice(0, 4);
      if (y !== lastYear) {
        lastYear = y;
        const yh = document.createElement("div");
        yh.className = "month-picker-year";
        yh.textContent = (lang === "zh" ? y + "年" : y);
        panel.appendChild(yh);
        yearGrid = document.createElement("div");
        yearGrid.className = "month-picker-grid";
        panel.appendChild(yearGrid);
      }
      const item = document.createElement("div");
      item.className = "month-picker-item"
        + (i === monthIdx ? " active" : "")
        + (i === todayIdxForPicker ? " is-today" : "");
      const mNum = m.id.slice(5, 7).replace(/^0/, "");
      item.textContent = lang === "zh" ? (mNum + "月") : m.short.en.split(" ")[0].slice(0, 3);
      item.title = m.short[lang];
      item.onclick = () => { monthIdx = i; monthPickerOpen = false; render(); };
      yearGrid.appendChild(item);
    });
    // anchor the panel to the whole nav group (flush with the bar's left edge),
    // not to the label button, so it lines up with the grid/filter bar below it
    mnav.appendChild(panel);
  }

  const nextBtn = document.createElement("button");
  nextBtn.className = "month-nav-btn";
  nextBtn.textContent = "›";
  nextBtn.setAttribute("aria-label", T.nextMonth[lang]);
  nextBtn.title = T.nextMonth[lang];
  nextBtn.disabled = monthIdx >= MONTHS.length - 1;
  nextBtn.onclick = () => { if (monthIdx < MONTHS.length - 1) { monthIdx += 1; render(); } };
  mnav.appendChild(nextBtn);

  bar.appendChild(mnav);

  const todayIdx = findTodayMonthIdx();
  if (todayIdx !== monthIdx) {
    const todayBtn = document.createElement("button");
    todayBtn.className = "month-nav-today";
    todayBtn.textContent = T.todayBtn[lang];
    todayBtn.onclick = () => { monthIdx = todayIdx; render(); };
    bar.appendChild(todayBtn);
  }

  const divider = document.createElement("div");
  divider.className = "bar-divider";
  bar.appendChild(divider);

  const rlabel = document.createElement("span");
  rlabel.className = "rlabel";
  rlabel.textContent = T.regionLabel[lang];
  bar.appendChild(rlabel);

  const wrap = document.createElement("div");
  wrap.className = "region-select-wrap";
  const select = document.createElement("select");
  select.className = "region-select";
  REGIONS.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r.id;
    opt.textContent = lang === "zh" ? r.zh : r.en;
    if (r.id === regionId) opt.selected = true;
    select.appendChild(opt);
  });
  select.onchange = (e) => { regionId = e.target.value; render(); };
  wrap.appendChild(select);
  bar.appendChild(wrap);

  const hint = document.createElement("span");
  hint.className = "region-badge-hint";
  const codeCount = region.codes.length;
  hint.textContent = lang === "zh"
    ? (codeCount ? `当前区域覆盖 ${codeCount} 个国家/地区` : "当前区域暂无覆盖国家/地区")
    : (codeCount ? `${codeCount} countries/regions in this filter` : "No countries/regions in this filter yet");
  bar.appendChild(hint);

  // empty banner for ME (or any region with zero codes)
  const banner = document.getElementById("emptyBanner");
  banner.innerHTML = "";
  if (regionId !== "all" && region.codes.length === 0) {
    const div = document.createElement("div");
    div.className = "empty-banner";
    div.textContent = lang === "zh"
      ? `${region.zh} 目前暂无覆盖仓储/发货国家,以下日历留作后续该区域开仓后使用。`
      : `${region.en} currently has no warehouse / fulfillment countries covered. This calendar view is reserved for future use once a warehouse opens here.`;
    banner.appendChild(div);
  }

  const wr = document.getElementById("weekdayRow");
  wr.innerHTML = "";
  T.weekdays[lang].forEach(w => {
    const d = document.createElement("div");
    d.textContent = w;
    wr.appendChild(d);
  });

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  month.weeks.forEach((week) => {
    week.forEach((day, c) => {
      const cell = document.createElement("div");
      const isWeekend = (c === 0 || c === 6);
      if (day === 0) {
        cell.className = "cell blank";
      } else {
        const items = filteredItems(day);
        const sev = items.some(h => h.sev === "severe") ? "severe" : (items.some(h => h.sev === "medium") ? "medium" : "");
        cell.className = "cell" + (sev ? " " + sev : "") + (isWeekend ? " weekend" : "");
        const num = document.createElement("div");
        num.className = "num";
        num.textContent = day;
        cell.appendChild(num);
        items.slice(0,3).forEach(h => {
          const badge = document.createElement("div");
          badge.className = "badge " + h.sev;
          badge.textContent = h.country;
          cell.appendChild(badge);
          const label = document.createElement("div");
          label.className = "label";
          label.textContent = h[lang];
          cell.appendChild(label);
        });
      }
      grid.appendChild(cell);
    });
  });

  // callouts filtered by region (region:"all" callouts always show)
  const co = document.getElementById("callouts");
  co.innerHTML = "";
  const visibleCallouts = (month.callouts || []).filter(c => c.region === "all" || regionId === "all" || c.region === regionId);
  if (visibleCallouts.length === 0) {
    const div = document.createElement("div");
    div.className = "no-callout";
    div.textContent = T.noHolidayThisRegion[lang];
    co.appendChild(div);
  } else {
    visibleCallouts.forEach(c => {
      const box = document.createElement("div");
      box.className = "callout sev-" + c.sev;
      box.innerHTML = `
        <div class="top">
          <div class="code">${c.code}</div>
          <div class="title">${c.title[lang]}</div>
        </div>
        <div class="dates">${c.dates[lang]}</div>
        <div class="note">${c.note[lang]}</div>
      `;
      co.appendChild(box);
    });
  }

  // footer: quiet countries in current region scope (no holiday this month)
  const scopeCodes = region.codes;
  const activeCodes = new Set();
  Object.values(month.holidays).forEach(items => items.forEach(h => {
    h.country.split("/").forEach(code => activeCodes.add(code));
  }));
  const quiet = scopeCodes.filter(c => !activeCodes.has(c));
  let footerText = T.note[lang] + " · " + T.generated[lang];
  if (quiet.length) {
    const names = quiet.map(c => COUNTRY[c][lang]).join(lang === "zh" ? "、" : ", ");
    footerText = T.quietPrefix[lang] + names + " · " + footerText;
  }
  document.getElementById("footer").textContent = footerText;
}

function toggleLang() {
  lang = (lang === "zh") ? "en" : "zh";
  render();
}

document.addEventListener("click", () => {
  if (monthPickerOpen) { monthPickerOpen = false; render(); }
});

render();
</script>
</body>
</html>
